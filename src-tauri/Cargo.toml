[package]
name = "ai-inbox"
version = "0.8.0"
description = "AI Inbox — Claude Code·Codex 요청을 채팅처럼 모아 보는 데스크톱 앱"
authors = ["YeoJeongHun"]
license = "MIT"
repository = "https://github.com/YeoJeongHun1/ai-inbox"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_inbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# 새 버전 — GitHub 릴리스의 서명된 업데이트만 받는다(공개키 고정)
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.10"
# 코노티 연결(선택 기능)에서만 쓰는 HTTPS 클라이언트 — rustls, 네이티브 TLS 없음
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
snow = "0.9"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
getrandom = "0.2"
semver = "1"
# 이미지 첨부 — 형식 확인·썸네일(풀기 전에 크기 한도를 건다). 코덱은 네 가지만
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
