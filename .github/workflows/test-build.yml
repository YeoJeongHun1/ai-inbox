name: Test build (Windows)

# 수정 브랜치를 실기 확인용으로 빌드만 한다 — 태그·릴리스·publish 없음. 설치 파일은 Actions 아티팩트로만 남는다.
# 기본 브랜치에 두지 않고 test-build/** 브랜치에 push 해서 돌린다.
on:
  push:
    branches: ["test-build/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 브랜치의 액션, 버전은 아래에서 고정
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: npm ci
      # createUpdaterArtifacts 가 켜져 있어 서명 키가 필요하다 — 값은 비밀값에만 있다
      - run: npx tauri build --ci -- --locked
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: SHA256
        shell: bash
        run: sha256sum src-tauri/target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-build-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
