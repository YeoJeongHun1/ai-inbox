name: Release

# v* 태그를 올리면 macOS(universal)·Windows 설치 파일을 빌드해 **초안 릴리스**에 올린다.
# 초안을 확인한 뒤 사람이 직접 공개한다.
#
# - 빌드 잡에는 쓰기 토큰이 없다(contents: read). 빌드 중 도는 npm/cargo 스크립트가 릴리스를 건드릴 수 없게.
# - 릴리스 빌드는 캐시를 복원하지 않고, 툴체인 버전과 Cargo.lock 을 고정한다.
# - 업로드 잡이 SHA256SUMS 와 빌드 출처 증명(GitHub attestation)을 함께 올린다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "이미 있는 릴리스 태그 (예: v0.1.0)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            out: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            args: ""
            rust_targets: ""
            out: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      # 수동 실행이어도 반드시 그 태그가 가리키는 커밋을 빌드한다
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 브랜치의 액션, 버전은 아래에서 고정
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_targets }}
      - run: npm ci
      # 앱 안 업데이트용 서명(공개키는 tauri.conf.json 에 고정) — 개인키는 저장소 비밀값에만 있다
      - run: npx tauri build --ci ${{ matrix.args }} -- --locked
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # 바뀐 점(CHANGELOG.md)만 — 앱 안 업데이트 알림에 보인다
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # 아티팩트는 하위 폴더(nsis/·msi/)째 내려온다 — 설치 파일만 한 폴더에 모은다
      - name: SHA256SUMS
        run: |
          mkdir release
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} release/ \;
          cd release
          # GitHub 는 첨부 이름의 공백을 점으로 바꾼다 — 받은 이름과 SHA256SUMS 가 맞도록 미리 바꾼다
          for f in *' '*; do [ -e "$f" ] && mv -- "$f" "${f// /-}"; done
          ls -la
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # 앱 안 업데이트가 읽는 목록. 초안을 "공개"로 바꿔야 releases/latest 가 이 릴리스를 가리킨다 — 사용자에게 알림이 가는 시점을 사람이 정한다
      - name: latest.json
        env:
          REPO: ${{ github.repository }}
        run: |
          cd release
          python3 - <<'PY'
          import glob, json, os, datetime
          tag = os.environ["TAG"]; repo = os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          def one(pattern):
              found = [f for f in glob.glob(pattern) if not f.endswith(".sig")]
              if len(found) != 1:
                  raise SystemExit(f"{pattern}: {found}")
              f = found[0]
              return {"url": base + f, "signature": open(f + ".sig").read().strip()}
          mac = one("*.app.tar.gz")
          win = one("*-setup.exe")
          version = tag.lstrip("v")
          notes, on = [], False
          for line in open("../src/CHANGELOG.md", encoding="utf-8"):
              if line.startswith("## "):
                  on = line[3:].strip() == version
                  continue
              if on:
                  notes.append(line.rstrip("\n"))
          doc = {
              "version": version,
              "notes": "\n".join(notes).strip(),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"darwin-aarch64": mac, "darwin-x86_64": mac, "windows-x86_64": win},
          }
          json.dump(doc, open("latest.json", "w"), indent=2)
          print(json.dumps(doc, indent=2))
          PY
      # 출처 증명은 공개 레포에서만 무료로 된다 — 비공개일 때는 건너뛴다
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: "release/*"
      - name: 초안 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" release/* --repo "$REPO" --draft --verify-tag \
            --title "AI Inbox $TAG" \
            --notes "설치 방법과 개인정보·보안 설명은 README 를 보세요. 받은 파일은 SHA256SUMS.txt 로, 출처는 \`gh attestation verify <파일> --repo $REPO\` 로 확인할 수 있습니다."
